format_version = 7
id = "mmx4.coop"
version = "0.0.1"
name = "X + Zero Co-op (Playtest)"
author = "mstan"
description = "Early simultaneous X and Zero playtest. Unified is the default; independent Split views are experimental."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "coop"
name = "X + Zero Co-op"
description = "Play together as X and Zero. Configure boss doors, boss battles, HUD and character codes below for local co-op or netplay. Requires OpenGL and a fresh boot."
group = "Experimental"
default_enabled = false

[[option]]
feature = "coop"
id = "cameras"
label = "Netplay cameras"
description = "Unified (default) shares a camera. Experimental Split gives each online player an independent view of the shared world. The host chooses for both peers. Local play uses the separate Local co-op display setting."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "split"
label = "Split (Experimental)"

[[option]]
feature = "coop"
id = "local_cameras"
label = "Local co-op display"
description = "Unified shares one screen. Experimental side-by-side gives each local player a 4:3 camera and HUD, together in an 8:3 view. Independent pause menus show both character menus side by side in either local layout. Shared story scenes use one view. Requires a fresh boot; this setting does not change online cameras."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "split"
label = "Side by side 8:3 (Experimental)"

[[option]]
feature = "coop"
id = "hud_layout"
label = "HUD layout"
description = "Unified views stack the meters by default. Side by side restores the previous two-column layout. Split views keep only the local player's meter at its native position."
type = "choice"
default = "stacked"
[[option.choice]]
value = "stacked"
label = "Stacked"
[[option.choice]]
value = "side_by_side"
label = "Side by side"

[[option]]
feature = "coop"
id = "boss_doors"
label = "Boss doors and refight teleporters"
description = "Either player activates boss doors and fortress refight teleporters by default. Both players requires both living players to touch the same door or teleporter; a dead or teleported-out partner does not hold it closed. Works locally and online; the netplay host chooses for both players."
type = "choice"
default = "either"
[[option.choice]]
value = "either"
label = "Either player"
[[option.choice]]
value = "both"
label = "Both players"

[[option]]
feature = "coop"
id = "extra_players"
label = "Extra local players (Experimental)"
description = "Add Player 3 and Player 4, each on their own controller and with their own hero, armor and colors (assign them in Controls). Local Unified co-op only: ignored for netplay and split views. Save states and rewind are unavailable while extra players are active. Extra players stay near the team, respawn beside Player 1 a few seconds after falling, and do not count toward team survival. Requires a fresh boot."
type = "choice"
default = "0"
[[option.choice]]
value = "0"
label = "None"
[[option.choice]]
value = "1"
label = "Player 3"
[[option.choice]]
value = "2"
label = "Players 3 and 4"

[[option]]
feature = "coop"
id = "p3_colors"
label = "Player 3 colors"
description = "Recolor Player 3 so the copies are easy to tell apart. Presentation only."
type = "choice"
default = "swap"
[[option.choice]]
value = "original"
label = "Original"
[[option.choice]]
value = "swap"
label = "Swap red and blue"
[[option.choice]]
value = "rotate"
label = "Rotate colors"
[[option.choice]]
value = "rotate_back"
label = "Rotate colors (reverse)"
[[option.choice]]
value = "shadow"
label = "Shadow"
[[option.choice]]
value = "gold"
label = "Gold"
[[option.choice]]
value = "black"
label = "Black (Zero only; others keep original colors)"

[[option]]
feature = "coop"
id = "p4_colors"
label = "Player 4 colors"
description = "Recolor Player 4 so the copies are easy to tell apart. Presentation only."
type = "choice"
default = "gold"
[[option.choice]]
value = "original"
label = "Original"
[[option.choice]]
value = "swap"
label = "Swap red and blue"
[[option.choice]]
value = "rotate"
label = "Rotate colors"
[[option.choice]]
value = "rotate_back"
label = "Rotate colors (reverse)"
[[option.choice]]
value = "shadow"
label = "Shadow"
[[option.choice]]
value = "gold"
label = "Gold"
[[option.choice]]
value = "black"
label = "Black (Zero only; others keep original colors)"

[[option]]
feature = "coop"
id = "p3_hero"
label = "Player 3 hero"
description = "Same as Player 2, or a specific hero. Player 3 may play the same hero as Player 1."
type = "choice"
default = "partner"
[[option.choice]]
value = "partner"
label = "Same as Player 2"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "zero"
label = "Zero"

[[option]]
feature = "coop"
id = "p3_armor"
label = "Player 3 armor (X only)"
description = "Follow the campaign's armor parts, wear none, wear all four Force Armor parts, or wear Ultimate Armor for this player only. Has no effect on Zero."
type = "choice"
default = "campaign"
[[option.choice]]
value = "campaign"
label = "Follow the campaign"
[[option.choice]]
value = "none"
label = "No armor"
[[option.choice]]
value = "force"
label = "Force Armor (all parts)"
[[option.choice]]
value = "ultimate"
label = "Ultimate Armor"

[[option]]
feature = "coop"
id = "p4_hero"
label = "Player 4 hero"
description = "Same as Player 2, or a specific hero. Player 4 may play the same hero as Player 1."
type = "choice"
default = "partner"
[[option.choice]]
value = "partner"
label = "Same as Player 2"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "zero"
label = "Zero"

[[option]]
feature = "coop"
id = "p4_armor"
label = "Player 4 armor (X only)"
description = "Follow the campaign's armor parts, wear none, wear all four Force Armor parts, or wear Ultimate Armor for this player only. Has no effect on Zero."
type = "choice"
default = "campaign"
[[option.choice]]
value = "campaign"
label = "Follow the campaign"
[[option.choice]]
value = "none"
label = "No armor"
[[option.choice]]
value = "force"
label = "Force Armor (all parts)"
[[option.choice]]
value = "ultimate"
label = "Ultimate Armor"
[[plugin]]
feature = "coop"
id = "mmx4.coop"

# A private camera cannot use the one shared retail scrolling tile ring.
# Derive the authored-map renderer even when its standalone switch is off.
[[requirement]]
feature = "coop"
package = "mmx4.enhancement.widescreen"
requires_feature = "widescreen"
when = { local_cameras = "split" }

[[option]]
feature = "coop"
id = "simultaneous_menus"
label = "Independent pause menus"
description = "Either player opens both character menus. Each player manages their own weapons and E-tanks; either player resumes both. During tank use, the partner can keep managing their menu; gameplay resumes only after consumption finishes. Automatically requires separate E-tank contents, regardless of the setting below. W-tank energy remains shared. Local play shows both menus side by side; netplay shows your character's menu with either camera setting. On by default for every co-op mode. Requires a fresh boot; the netplay host chooses for both players."
type = "boolean"
default = "true"

[[option]]
feature = "coop"
id = "separate_etanks"
label = "Separate E-tanks with individual pausing"
description = "Independent pause menus always require separate E-tank contents. When Independent pause menus is off, this setting chooses separate or shared energy. Both players share tanks acquired by Player 1's campaign; pickups refill the collector's own energy when contents are separate. W-tanks stay shared. Requires a fresh boot; the netplay host chooses for both players."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "both_story_bosses"
label = "Fight Double and Iris"
description = "After your campaign's encounter, return to the boss door for the other fight before continuing the story. Works in local and online co-op; the netplay host chooses for both players."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "boss_scaling"
label = "Co-op boss scaling"
description = "Double effective boss health using the selected hit cooldown method, and reduce Zero's damage to bosses by 20%. Works in local and online co-op. Off preserves the original balance."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "boss_cooldowns"
label = "Boss hit cooldowns"
description = "With co-op boss scaling enabled, both methods halve boss hit cooldowns. Separate cooldowns let each player damage a boss independently, with short recovery for Zero's ground and aerial slashes and native attack contact checks. Reduced shared cooldowns uses one shared timer. The netplay host chooses for both players."
type = "choice"
default = "per_player"
[[option.choice]]
value = "per_player"
label = "Separate for each player"
[[option.choice]]
value = "shared"
label = "Reduced shared cooldowns"

[[option]]
feature = "coop"
id = "ultimate_armor_x"
label = "Ultimate Armor X code"
description = "Automatically enable X's native Ultimate Armor code for either player. A capsule still grants the armor. Works in local and online co-op, together with Black Zero."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "black_zero"
label = "Black Zero"
description = "Automatically use Zero's native black palette for either player. Works in local and online co-op, together with Ultimate Armor X."
type = "boolean"
default = false
